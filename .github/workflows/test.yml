name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.10"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # PyGObject builds from source on the runner; it needs these headers.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository-2.0-dev libcairo2-dev pkg-config libglib2.0-bin

      # [test] brings pytest and pytest-cov (pytest.ini uses --cov).
      # nocturne-shift>=0.5.0 isn't on PyPI yet; install it from its repo
      # first. Drop that line once cli-v0.5.x is released on PyPI.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nocturne-shift @ git+https://github.com/christophermca/night-shift@dev"
          python -m pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest
