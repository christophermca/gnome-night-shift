name: Publish to TestPyPI

# Run by hand: Actions tab -> "Publish to TestPyPI" -> Run workflow.
# Logs in with Trusted Publishing: the gnome-night-shift project on
# test.pypi.org needs a publisher with repository
# christophermca/gnome-night-shift, workflow `publish-testpypi.yml` and
# environment `test-pypi` (Settings -> Environments in this repo).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # PyGObject builds from source on the runner; it needs these headers.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository-2.0-dev libcairo2-dev pkg-config libglib2.0-bin

      # nocturne-shift>=0.5.0 isn't on PyPI yet; install it from its repo
      # first. Drop that line once cli-v0.5.x is released on PyPI.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0     # setuptools-scm reads the gnome-v* tags

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --outdir dist/
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: test-pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI refuses a version twice; skip instead of failing.
          skip-existing: true
