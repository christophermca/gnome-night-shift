[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
authors = [
  { name="Christopher McAdams", email="mca.christopher@gmail.com" }
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Environment :: X11 Applications :: Gnome",
]
# PyGObject is listed here as well as in nocturne-shift so that this package keeps it
# once the GNOME-only parts of the core (GSettings storage, geoclue) move here.
dependencies = [
  "nocturne-shift>=0.5.0",
  "PyGObject>=3.48.0",
]
dynamic = ["version"]
description = "Switch GNOME between light and dark at sunrise and sunset: systemd timers (`gnome-night-shift`) for the gnome-shell-night-shift-extension"
keywords = ["gnome", "night shift", "dark mode", "sunrise", "sunset", "theme", "systemd"]
license = "MIT"
requires-python = ">=3.10"
readme = "README.md"
name = "gnome-night-shift"

[project.urls]
Homepage = "https://github.com/christophermca/gnome-night-shift"
"nocturne-shift" = "https://github.com/christophermca/nocturne-shift"
"GNOME extension" = "https://github.com/christophermca/gnome-shell-extension-night-shift"

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]
dev = ["black"]

# Its own command, so `pipx install gnome-night-shift` puts one on PATH
[project.scripts]
gnome-night-shift = "night_shift_services.cli:main"

# Adds `nocturne-shift services ...` to the core's command
[project.entry-points."night_shift.commands"]
services = "night_shift_services.cli:register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"night_shift_services" = ["systemd/user/*.timer", "systemd/user/*.service"]

[tool.setuptools_scm]
tag_regex = '^gnome-v(?P<version>\d+\.\d+\.\d+)$'
git_describe_command = "git describe --dirty --tags --long --match 'gnome-v*'"
local_scheme = "no-local-version"
fallback_version = "0.0.0"
